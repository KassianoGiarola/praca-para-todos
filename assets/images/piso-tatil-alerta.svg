<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Piso tátil de alerta</title>
<desc id="desc">Ilustração de uma calçada cinza com uma placa amarela de piso tátil de alerta formada por relevos em pontos distribuídos em grade.</desc>
<defs>
  <linearGradient id="ground" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#d9ddda"/><stop offset="1" stop-color="#aeb7b1"/></linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6d65b"/><stop offset="1" stop-color="#d9a900"/></linearGradient>
  <radialGradient id="dome" cx="35%" cy="25%" r="80%"><stop stop-color="#fff0a0"/><stop offset=".28" stop-color="#f6d85f"/><stop offset=".72" stop-color="#d4a00b"/><stop offset="1" stop-color="#a97805"/></radialGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="pavers" width="260" height="150" patternUnits="userSpaceOnUse"><path d="M0 0H260M0 75H260M0 150H260M130 0V75M65 75V150" fill="none" stroke="#929c96" stroke-opacity=".34" stroke-width="3"/></pattern>
  <pattern id="dots" width="100" height="100" patternUnits="userSpaceOnUse">
    <ellipse cx="50" cy="57" rx="22" ry="16" fill="#9d7609" opacity=".36" filter="url(#shadow)"/>
    <circle cx="50" cy="47" r="23" fill="url(#dome)" stroke="#bd8e0b" stroke-width="2"/>
    <ellipse cx="43" cy="39" rx="7" ry="4" fill="#fff4b8" opacity=".7"/>
  </pattern>
</defs>
<rect width="1200" height="700" fill="url(#ground)"/>
<rect width="1200" height="700" fill="url(#pavers)"/>
<rect x="260" y="95" width="680" height="510" rx="8" fill="#b18a18" opacity=".24" filter="url(#shadow)"/>
<rect x="245" y="80" width="680" height="510" rx="8" fill="url(#tile)" stroke="#c99b10" stroke-width="5"/>
<rect x="245" y="80" width="680" height="510" rx="8" fill="url(#dots)"/>
<rect x="245" y="80" width="680" height="510" rx="8" fill="none" stroke="#fff0a0" stroke-opacity=".55" stroke-width="3"/>
</svg>